name: Tests

on:
  push:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.changes.outputs.project }}
      src: ${{ steps.changes.outputs.src }}
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          filters: |
            workflow: &workflow
              - '.github/actions/**'
              - '.github/workflows/tests.yaml'
              - '.github/workflows/.tests-matrix.yaml'
            project: &project
              - *workflow
              - 'poetry.lock'
              - 'pyproject.toml'
            src:
              - *project
              - 'src/**/*.py'
            tests:
              - *project
              - 'src/**/*.py'
              - 'tests/**'

  lockfile:
    name: Check poetry.lock
    runs-on: ubuntu-latest
    if: needs.changes.outputs.project == 'true'
    needs: changes
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/bootstrap-poetry

      - run: poetry check --lock

  smoke:
    name: Smoke-test build and install
    runs-on: ubuntu-latest
    if: needs.changes.outputs.src == 'true'
    needs: changes
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - run: pipx run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distfiles
          path: dist/
          if-no-files-found: error

      - run: pipx run twine check --strict dist/*

      - run: pipx install --suffix=@build dist/*.whl

      - uses: ./.github/actions/bootstrap-poetry

      # Smoke test: confirm the version of the installed wheel matches the project.
      - run: poetry@build --version | grep $(poetry version --short)

  hardlink-e2e:
    name: Hardlink E2E (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.image }}
    if: needs.changes.outputs.tests == 'true'
    needs: changes
    strategy:
      matrix:
        os:
          - name: Windows
            image: windows-2022
          - name: macOS
            image: macos-14
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/bootstrap-poetry
        with:
          python-version: "3.12"

      - uses: ./.github/actions/poetry-install

      - run: poetry run pytest tests/installation/test_wheel_installer.py tests/installation/test_unpacked_wheel_store.py tests/utils/test_filesystem.py -v

      - if: runner.os != 'Windows'
        run: poetry run pytest tests/installation/test_integration.py --integration -v

  tests-matrix:
    # Use this matrix with multiple jobs defined in a reusable workflow:
    uses: ./.github/workflows/.tests-matrix.yaml
    name: "${{ matrix.os.name }} (Python ${{ matrix.python-version }})"
    if: '!failure()'
    needs:
      - lockfile
      - changes
    with:
      runner: ubuntu-22.04
      python-version: "3.12"
      run-mypy: ${{ needs.changes.outputs.tests == 'true' }}
      run-pytest: ${{ needs.changes.outputs.tests == 'true' }}
      run-pytest-export: ${{ needs.changes.outputs.src == 'true' }}
    secrets: inherit  # zizmor: ignore[secrets-inherit]
    strategy:
      matrix:
        os:
          - name: Ubuntu
            image: ubuntu-22.04
        python-version:
          - "3.12"
      fail-fast: false

  status:
    name: Status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lockfile
      - smoke
      - hardlink-e2e
      - tests-matrix
    steps:
      - run: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'false' || 'true' }}
